info:
  name: login-buyer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{buyerEmail}}",
        "password": "{{buyerPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && typeof res.body?.token === "string" && res.body.token.length > 0) {
          bru.setEnvVar("buyerToken", res.body.token);
        } else {
          throw new Error("Login do comprador falhou ou não retornou token");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
