info:
  name: logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204) {
          bru.setEnvVar("buyerToken", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
