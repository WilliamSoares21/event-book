info:
  name: create-card
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/cards"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && typeof res.body?.id === "string") {
          bru.setEnvVar("cardId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
