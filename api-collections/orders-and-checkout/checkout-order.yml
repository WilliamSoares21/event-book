info:
  name: checkout-order
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/orders/{{orderId}}/checkout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cardId": "{{cardId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: 547e9ac1-801b-4d7b-94e1-059f3df44b85

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
