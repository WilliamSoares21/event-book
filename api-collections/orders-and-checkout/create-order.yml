info:
  name: create-order
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/orders"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    content: |
      {
        "ticketLotId": "{{ticketLotId}}",
        "quantity": 2
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false