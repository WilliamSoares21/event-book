info:
  name: create-ticket-lot
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events/:eventId/ticket-lots"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Lote 1 VIP - CLOUD event",
        "unitPrice": 500,
        "capacity": 10,
        "salesStart": "2026-11-17T17:01:27.032Z",
        "salesEnd": "2026-11-17T20:01:27.032Z"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && typeof res.body?.id === "string") {
          bru.setEnvVar("lotId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
