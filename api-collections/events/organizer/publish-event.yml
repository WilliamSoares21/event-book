  url: "{{baseUrl}}/events/:id/publication"
  auth: inherit
  params:
    - name: id
      value: "{{eventId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
