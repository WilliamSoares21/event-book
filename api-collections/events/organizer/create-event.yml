info:
  name: create-event
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "title": "Festival EventBook",
        "description": "Evento com música ao vivo, gastronomia e apresentações culturais.",
        "startsAt": "2026-11-20T19:00:00-03:00",
        "endsAt": "2026-11-20T23:00:00-03:00",
        "location": "Fortaleza - CE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && typeof res.body?.id === "string") {
          bru.setEnvVar("eventId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
