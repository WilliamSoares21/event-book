info:
  name: create-event-with-buyer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/events"
  auth:
    type: bearer
    token: "{{buyerToken}}"
  body:
    type: json
    body: |
      {
        "title": "Tentativa do comprador",
        "startsAt": "2026-11-20T19:00:00-03:00",
        "endsAt": "2026-11-20T23:00:00-03:00",
        "location": "São Paulo"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status !== 403) {
          throw new Error(`Esperado 403, recebido ${res.status}`);
        }
