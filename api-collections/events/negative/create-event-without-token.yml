info:
  name: create-event-without-token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events"
  auth: none
  body:
    type: json
    body: |
      {
        "title": "Tentativa sem autenticação",
        "description": "Deve retornar 401.",
        "startsAt": "2026-11-20T19:00:00-03:00",
        "endsAt": "2026-11-20T23:00:00-03:00",
        "location": "São Paulo"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status !== 401) {
          throw new Error(`Esperado 401, recebido ${res.status}`);
        }
