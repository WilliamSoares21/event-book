<div class="side-page-menu">
        <header class="brand-header">
            <img src="assets/logo.png" class="logo" alt="Logo do Event Book" height="50" width="50">
            <h5>Event Book</h5>
        </header>
    <nav class="side-page-nav">
        <ul>
            @if (roleUser === 'STAFF') {
            <li routerLinkActive="active">
                <a routerLink="/staff/events">
                    <img src="assets/events/calendar.png" width="20" height="20" alt="">
                    <span class="menu-label">Staff Eventos</span>
                </a>
            </li>
            } @else {
            <li routerLinkActive="active">
                <a routerLink="/events">
                    <img src="assets/events/calendar.png" width="20" height="20" alt="Ícone de Eventos">
                    <label>Eventos</label>
                </a>
            </li>
            }
            @if (roleUser === 'COMPRADOR') {
            <li routerLinkActive="active">
                <a routerLink="/tickets">
                    <img src="assets/tickets/ticket.png" width="20" height="20" alt="Ícone de Tickets"> 
                    <label>Tickets</label> 
                </a>
            </li>
            }
            @if (roleUser === 'COMPRADOR') {
            <li routerLinkActive="active">
                <a routerLink="/orders">
                    <img src="assets/orders/order.png" width="20" height="20" alt="Ícone de Pedidos">
                    <label>Pedidos</label>
                </a>
            </li>
            }
            <li class="logout-item">
                <button type="button" class="logout-button" (click)="logout()" [disabled]="loggingOut()">
                    <img src="assets/logout.png" width="20" height="20" alt="">
                    {{ loggingOut() ? 'Saindo…' : 'Sair' }}
                </button>
            </li>
        </ul>
    </nav>
</div>
