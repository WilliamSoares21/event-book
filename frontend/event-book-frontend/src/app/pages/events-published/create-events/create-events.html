<div class="container py-4">
  <h2>Criar Evento</h2>
  <form [formGroup]="singUpForm" (ngSubmit)="createLots()">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Nome do Evento</label>
        <input class="form-control" formControlName="eventName" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Descrição</label>
        <input class="form-control" formControlName="eventDescription">
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Local</label>
        <input class="form-control" formControlName="venueName" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Logradouro</label>
        <input class="form-control" formControlName="street" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-3 mb-3">
        <label class="form-label">Número</label>
        <input class="form-control" formControlName="number">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Bairro</label>
        <input class="form-control" formControlName="neighborhood" required>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Cidade</label>
        <input class="form-control" formControlName="city" required>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">UF (ex: CE)</label>
        <input class="form-control" formControlName="state" maxlength="2" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Próximo</button>
  </form>
</div>
