<section class="side-page">
     <app-menu-side-bar></app-menu-side-bar>
      <div class="side-page-content">
        <header class="brand-header">
            <div class="brand-header-content">
                <h2>Adicione os lotes do evento</h2>
                <p>Crie um ou mais de ingressos para o seu evento. Você pode definir nomes, valores,</p>
                <p class="div-paragraph">quantidades e período de vendas para cada lote.</p>
            </div>
        </header>
        <main class="side-page-main">
            @for (lot of lots; track lot.id; let index = $index) {
            <form #lotForm="ngForm">
                <fieldset [disabled]="isLotLocked(lot.id)">
                <div class="lot-header">
                    <h3>Lote {{ index + 1 }}</h3>
                    <button type="button" class="btn btn-outline-danger remove-lot"
                        (click)="removeLot(lot.id)" [attr.aria-label]="'Excluir lote ' + (index + 1)"
                        title="Excluir lote">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6" />
                        </svg>
                    </button>
                </div>
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                         <label [for]="'nome-lote-' + lot.id">Nome do lote</label>
                        <div class="input-group">                    
                            <input type="text" class="form-control" [id]="'nome-lote-' + lot.id" [(ngModel)]="lot.name" [ngModelOptions]="{standalone: true}" aria-label="Nome do lote" required/>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                         <label [for]="'valor-ingresso-' + lot.id">Valor do ingresso (R$)</label>
                        <div class="input-group">                    
                            <input type="number" class="form-control" [id]="'valor-ingresso-' + lot.id" [(ngModel)]="lot.price" [ngModelOptions]="{standalone: true}" aria-label="Valor do ingresso" required min="0" step="0.01"/>
                        </div>
                    </div>
                     <div class="col-12 col-md-4">
                         <label [for]="'qtd-ingresso-' + lot.id">Quantidade disponível</label>
                        <div class="input-group">                    
                            <input type="number" class="form-control" [id]="'qtd-ingresso-' + lot.id" [(ngModel)]="lot.quantity" [ngModelOptions]="{standalone: true}" aria-label="Quantidade de ingressos disponíveis" required min="1"/>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-12 col-md-4">
                         <label [for]="'data-inicio-vendas-' + lot.id">Início das vendas</label>
                        <div class="input-group">                    
                            <input type="date" [attr.min]="today" class="form-control" [id]="'data-inicio-vendas-' + lot.id" [(ngModel)]="lot.salesStart" [ngModelOptions]="{standalone: true}" aria-label="Data início das vendas" required/>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                         <label [for]="'data-fim-vendas-' + lot.id">Fim das vendas</label>
                        <div class="input-group">                    
                            <input type="date" [attr.min]="today" class="form-control" [id]="'data-fim-vendas-' + lot.id" [(ngModel)]="lot.salesEnd" [ngModelOptions]="{standalone: true}" aria-label="Data fim das vendas" required/>
                        </div>
                    </div>
                </div>
                </fieldset>
            </form>
            }
            <button type="button" class="btn btn-outline-primary add-lot" (click)="addLot()" [disabled]="saving() || success()">
                <span aria-hidden="true">+</span>
                Adicionar lote
            </button>
            <div class="div-button-cancel-save">
                <div class="col-12 div-button">
                    <a routerLink="/events/create" [state]="{ event: event }" class="btn-cancel">
                        <i class="bi bi-arrow-left" aria-hidden="true"></i>
                        <span>Voltar</span>
                    </a>
                    <button type="button" class="btn btn-primary" (click)="createEvent()" [disabled]="saving() || success()">
                        <i class="bi bi-calendar"></i>
                        <span>{{ saving() ? 'Salvando...' : 'Criar evento' }}</span>
                    </button>
                </div>                
            </div>
        </main>
        </div>
</section>
