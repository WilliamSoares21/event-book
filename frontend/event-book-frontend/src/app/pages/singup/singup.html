<section class="login-page">
  <div class="login-form">
    <header class="brand-header">
      <div class="brand-header-content">
        <img src="assets/logo.png" class="logo" alt="Logo do Event Book" height="50" width="50">
        <h2>Event Book</h2>
      </div>
      <a href="/login" class="">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar para entrar</span>
      </a>
    </header>
    <main class="main-login">
        <div class="row align-items-center">
          <h1 class="col-6">Crie sua conta</h1>
          <label class="custom-etiqueta">Perfil selecionado: {{ perfilSelecionado }}</label>
        </div>
      <p>Preencha os dados abaixo para começar sua jornada no EventBook.</p>
      <section class="cards">
        <form [formGroup]="singUpForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <div class="row">
                <div class="col">
                    <label for="name">Nome</label>
                    <input type="text" id="name" formControlName="name" class="form-control" placeholder="Digite seu nome">
                </div>
                <div class="col">
                    <label for="lastName">Sobrenome</label>
                    <input type="text" id="lastName" formControlName="lastName" class="form-control" placeholder="Digite seu sobrenome">
                </div>
            </div>
        </div>  
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" class="form-control" placeholder="Digite seu email">
            <!-- <div *ngIf="singUpForm.get('email')?.invalid && singUpForm.get('email')?.touched" class="error-message">
              Por favor, insira um email válido.
            </div> -->
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" formControlName="password" class="form-control" placeholder="Digite sua senha">
            <!-- <div *ngIf="singUpForm.get('password')?.invalid && singUpForm.get('password')?.touched" class="error-message">
              A senha deve ter pelo menos 6 caracteres.
            </div> -->
          </div>
          <div class="alternative-option">
            <p><a href="/singup-perfil-type">Alterar perfil</a></p>
          </div>
          <button type="submit" class="btn btn-primary custom-btn" [disabled]="singUpForm.invalid">
            Criar conta
          </button>
        </form>
