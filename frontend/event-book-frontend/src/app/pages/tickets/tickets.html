<section class="side-page">
    <app-menu-side-bar [roleUser]="roleUser"></app-menu-side-bar>
    <div class="side-page-content">
        <header class="brand-header">
            <div class="brand-header-content">
                <h2>Meus tickets</h2>
                <p>Visualize os tickets que você comprou e acesse os detalhes de cada um.</p>
            </div>
        </header>
        <main class="side-page-main col-12">
            <section *ngFor="let ticket of tickets" class="card" style="max-width: 220px">
                <img src="assets/tickets/default-ticket.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h4 class="card-title">{{ ticket.name }}</h4>
                    <p class="card-text">{{ ticket.day }}</p>
                    <p class="card-text">{{ ticket.time }}</p>
                    <p class="card-text">{{ ticket.codigo }}</p>
                    <a href="#" class="btn-solid theme-primary">Mais Informações</a>
                </div>
            </section>
            <nav aria-label="...">
                <ul class="pagination">
                    <li class="page-item"><a href="#" class="page-link">Previous</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item active">
                    <a class="page-link" href="#" aria-current="page">2</a>
                    </li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
            </nav>    
        </main>
    </div>
</section>
