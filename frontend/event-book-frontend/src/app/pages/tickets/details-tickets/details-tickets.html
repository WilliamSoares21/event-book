<section class="side-page">
    <app-menu-side-bar [roleUser]="roleUser"></app-menu-side-bar>
    <div class="side-page-content">
        <header class="brand-header">
            <div class="brand-header-content">
                <h2>Detalhes do Ticket</h2>
                <p>Confira as informações do seu ticket.</p>
            </div>
        </header>
        <main class="ticket-details">
                <div class="card ticket-card">
                     <img src="assets/tickets/default-ticket.png" class="ticket-image" [alt]="ticket.name">
                    <div class="card-body">
                        <h3 class="card-title mb-2">{{ ticket.name }}</h3>
                        <div class="row mb-2">
                            <div class="col-6">
                                <p class="card-text">Data do Evento</p>
                            </div>
                            <div class="col-6">
                                <p class="card-text">{{ ticket.day }}</p>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <p class="card-text">Horário do Evento</p>
                            </div>
                            <div class="col-6">
                                <p class="card-text">{{ ticket.time }}</p>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <p class="card-text">Código do Ticket</p>
                            </div>
                            <div class="col-6">
                                <p class="card-text">{{ ticket.codigo }}</p>
                            </div>
                        </div>
                    </div>
                </div>
        </main>
    </div>
</section>
