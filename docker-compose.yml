services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventbook}
      POSTGRES_USER: ${POSTGRES_USER:-eventbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eventbook_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        CURL_VERSION: ${CURL_VERSION:?Defina CURL_VERSION no .env}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eventbook}
      DB_USERNAME: ${POSTGRES_USER:-eventbook}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/event-book-frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/event-book-frontend/src:/app/src:ro
      - ./frontend/event-book-frontend/public:/app/public:ro
      - /app/node_modules
      - frontend_angular_cache:/app/.angular
    environment:
      NG_PERSISTENT_BUILD_CACHE: "1"

volumes:
  eventbook_data:
  frontend_angular_cache:
